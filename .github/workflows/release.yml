name: Release

# Tag-triggered, SemVer-respecting publish for every @qavo/* package.
#
# A maintainer cuts a release by pushing an annotated tag of the form `vX.Y.Z`
# (matching the value in every per-library package.json). This workflow:
#
#   1. validates the build, types and unit tests on the tagged ref,
#   2. ensures every @qavo/* package.json declares the tag's version
#      (defends against accidental publishes that drift from the tag),
#   3. publishes each built package to npm with provenance,
#   4. publishes a GitHub Release whose body is sourced from CHANGELOG.md.
#
# The job is gated on NPM_TOKEN being present in repository secrets; absent it,
# the workflow fails fast rather than half-publishing.

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-*'

permissions:
  contents: write
  id-token: write   # required for npm provenance

jobs:
  release:
    name: Build, validate & publish
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Derive release version
        id: version
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          if [[ "$VERSION" == *-* ]]; then
            echo "npm_tag=next" >> "$GITHUB_OUTPUT"
          else
            echo "npm_tag=latest" >> "$GITHUB_OUTPUT"
          fi

      - name: Verify package versions match the tag
        run: node scripts/verify-package-versions.mjs "${{ steps.version.outputs.version }}"

      - name: Build libraries
        run: npm run build:libs

      - name: Unit tests
        run: npm test -- --watch=false

      - name: Publish packages to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_DIST_TAG: ${{ steps.version.outputs.npm_tag }}
        run: node scripts/publish-packages.mjs

      - name: Extract release notes from CHANGELOG.md
        id: notes
        run: node scripts/extract-changelog.mjs "${{ steps.version.outputs.version }}" > release-notes.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          body_path: release-notes.md
          draft: false
          prerelease: ${{ steps.version.outputs.npm_tag == 'next' }}
